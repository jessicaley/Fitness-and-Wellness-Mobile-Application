<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Workouts</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content>
  <ion-list>
    <ion-item 
      *ngFor="let workout of workouts$ | async"
      button
      detail
      (click)="viewWorkoutDetails(workout.id)"
    >
      <ion-label>
        <h2>{{ workout.name }}</h2>
        <p>{{ workout.description }}</p>
        <p>Duration: {{ workout.duration }} minutes</p>
      </ion-label>
      <ion-badge color="success" slot="end" *ngIf="workout.completed">
        Completed
      </ion-badge>
    </ion-item>
  </ion-list>
</ion-content>
