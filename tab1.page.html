<ion-header>
  <ion-toolbar color="primary">
    <ion-title>Home</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <ion-card>
    <ion-card-header>
      <ion-card-title>Welcome to GetFit! 🏋️</ion-card-title>
    </ion-card-header>
    
    <ion-card-content>
      <ion-item lines="none">
        <ion-icon name="barbell" slot="start"></ion-icon>
        <ion-label>Completed Workouts: {{completedCount}}</ion-label>
      </ion-item>

      <ion-item lines="none" *ngIf="currentStreak > 0">
        <ion-icon name="trophy" slot="start"></ion-icon>
        <ion-label>Current Streak: {{ currentStreak }} days 🔥</ion-label>
      </ion-item>
    </ion-card-content>
  </ion-card>

  <ion-card>
    <ion-card-header>
      <ion-card-title>Quick Actions</ion-card-title>
    </ion-card-header>
    
    <ion-card-content>
    <ion-button expand="block" routerLink="/tabs/tab2">
      Start Workout
    </ion-button>
    </ion-card-content>
  </ion-card>
</ion-content>
